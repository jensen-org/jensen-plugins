<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Impact</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        color: #dedae9;
        background: #100e18;
        margin: 0;
        padding: 16px;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      input {
        flex: 1;
        background: #17131f;
        color: #dedae9;
        border: 1px solid #2a2436;
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 13px;
      }
      button {
        background: #b4a1f5;
        color: #17131f;
        border: 0;
        border-radius: 8px;
        padding: 8px 14px;
        font-size: 13px;
        cursor: pointer;
      }
      pre {
        margin-top: 12px;
        color: #a19db6;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h3>Impact of a file</h3>
    <div class="row">
      <input id="path" placeholder="src/auth.rs" />
      <button id="check">Check</button>
    </div>
    <pre id="out"></pre>
    <script src="main.js"></script>
  </body>
</html>
